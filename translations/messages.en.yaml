storkplus_sylius_bosta_shipping:
    calculator: 'Bosta'
    form:
        webhook_url: 'Bosta webhook URL'
        webhook_url_help: 'Fixed for this store. Bosta sends it on every delivery created here; to also receive updates for deliveries edited in the dashboard, add it in Bosta → Settings → API Integration → Webhook with the key name %header% and the secret below as value.'
        api_key: 'Bosta API key'
        api_key_help: 'Bosta dashboard → Settings → API Integration → Create API key with "Read/Write" access.'
        webhook_secret: 'Webhook secret'
        webhook_secret_help: 'Sent by Bosta in the %header% header so this store can trust the update. Generated for you; keep it if you configured it in Bosta.'
        pickup_city: 'Pickup city'
        pickup_city_help: 'Where Bosta collects your parcels; used for fee estimates.'
        business_location_id: 'Pickup location ID (optional)'
        business_location_id_help: 'Bosta pickup location to collect from. Leave empty to use your default location.'
        package_size: 'Package size'
        size:
            small: 'Small'
            medium: 'Medium'
            large: 'Large'
            light_bulky: 'Light bulky'
            heavy_bulky: 'Heavy bulky'
        fee_mode: 'Shipping fee'
        fee_mode_help: 'The flat amounts below are always used as a fallback when the Bosta estimate is unavailable.'
        fee_mode_flat: 'Flat amount per channel'
        fee_mode_estimate: 'Bosta fee estimate for the customer city'
        channels: 'Flat amount'
        cod_payment_methods: 'Cash on delivery payment methods'
        cod_payment_methods_help: 'Orders paid with these methods are created with the order total as COD, collected by Bosta, and their payment is completed when Bosta delivers.'
        auto_create: 'Create the Bosta delivery automatically'
        auto_create_help: 'When the order is placed with cash on delivery, or once it is paid online. You can always create or retry it from the order page.'
        complete_cod_on_delivery: 'Mark cash-on-delivery payments as paid when Bosta delivers'
        reference_prefix: 'Order reference prefix (optional)'
        reference_prefix_help: 'Sent to Bosta as business reference with the order number. Defaults to the store name; set it when several stores share one Bosta account.'
    ui:
        title: 'Bosta shipping'
        create: 'Create Bosta delivery'
        retry: 'Retry'
        recreate: 'Recreate'
        recreate_confirm: 'Cancel the current Bosta delivery and create a new one?'
        refresh: 'Refresh status'
        airway_bill: 'Airway bill'
        tracking_number: 'Tracking number'
        bosta_state: 'Bosta status'
        last_error: 'Last error'
        attempts: 'Attempts'
        last_update: 'Last update from Bosta'
        track_short: 'Track shipment'
        track: 'Track shipment %tracking% on Bosta'
        status:
            not_created: 'Not sent to Bosta'
            pending: 'Pending'
            created: 'Sent to Bosta'
            failed: 'Failed'
            terminated: 'Cancelled'
